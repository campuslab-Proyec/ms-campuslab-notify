server:
  port: 8083

spring:
  application:
    name: ms-campuslab-notify
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Todos los consumidores usan la factory "manualAckContainerFactory" de RabbitMQConfig:
    # ACK manual, prefetch 1 (fair dispatch) y sin requeue automático. Los reintentos son explícitos
    # en cada consumidor (ver DemoConsumers.processOrder).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:aff2eb38-d6cf-4220-8527-53f1cb6aed15}/v2.0
          # El BFF reenvía el token del usuario, emitido para la API ms-campuslab-bff
          audiences:
            - 8d19bb45-1842-43ce-b76c-4513b979df81
            - api://8d19bb45-1842-43ce-b76c-4513b979df81

# Nombres de exchanges, colas, DLQ y routing keys centralizados en un solo lugar.
# Se leen con MessagingProperties (RabbitMQConfig, consumidores y productores los usan desde aquí).
campuslab:
  rabbitmq:
    # API HTTP de management (plugin rabbitmq_management): AmqpAdmin no permite listar colas ni exchanges
    management:
      url: http://localhost:15672
      username: ${spring.rabbitmq.username}
      password: ${spring.rabbitmq.password}
    exchanges:
      command: cmd.direct
      dead-letter: cmd.dead.dlx
    queues:
      email:
        name: q.cmd.email
        routing-key: email.send
        dlq: q.cmd.email.dlq
      prep:
        name: q.cmd.prep
        routing-key: prep.ticket
        dlq: q.cmd.prep.dlq
      voucher:
        name: q.cmd.voucher
        routing-key: voucher.gen
        dlq: q.cmd.voucher.dlq
      # La declara también ms-campuslab-bookings con los mismos argumentos
      booking:
        name: notify.booking.queue
        routing-key: booking.status.changed
        dlq: notify.booking.dlq
    # Demos de las guías (página "Alertas y guías" del frontend)
    demo:
      logs-exchange: demo.logs.exchange
      logs-all-queue: demo.logs.all
      logs-errors-queue: demo.logs.errors
      orders-exchange: demo.orders.exchange
      orders-queue: demo.orders.queue
      orders-routing-key: order.created
      orders-dlx: demo.orders.dlx
      orders-dlq: demo.orders.dlq
      orders-ttl-ms: 30000              # sin consumir en 30 s -> DLX
      orders-max-length: 1000
      orders-dlq-retention-ms: 86400000 # la DLQ conserva los mensajes 24 h
      orders-max-retries: 3
